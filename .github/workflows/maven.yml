# This workflow builds the Java project and caches Maven dependencies.
name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
    paths:
      - "rag-bilibili-server/**"
      - ".github/workflows/maven.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "rag-bilibili-server/**"
      - ".github/workflows/maven.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file rag-bilibili-server/pom.xml

